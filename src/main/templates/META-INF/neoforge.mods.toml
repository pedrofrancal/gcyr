modLoader="javafml"
loaderVersion="${loader_version}"

license="${mod_license}"

issueTrackerURL="${mod_issue_tracker}"

[[mixins]]
    config="${mod_id}.mixins.json"

[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"

[[mods]]
    modId="${mod_id}"
    version="${version}"
    displayName="${mod_name}"
    updateJSONURL="${mod_update_url}"
    displayURL="${mod_url}"
    logoFile= "icon.png"
    credits="${mod_credits}"
    authors="${mod_authors}"

    description='''${mod_description}'''

    [[dependencies.${mod_id}]]
        modId="neoforge"
        type="required"
        versionRange="${neoforge_version}"
        ordering="NONE"
        side="BOTH"
    [[dependencies.${mod_id}]]
        modId="minecraft"
        type="required"
        versionRange="${minecraft_version}"
        ordering="NONE"
        side="BOTH"
    [[dependencies.${mod_id}]]
        modId="gtceu"
        type="required"
        versionRange="${gtceu_version}"
        ordering="AFTER"
        side="BOTH"
    [[dependencies.${mod_id}]]
        modId="modularui"
        type="required"
        versionRange="${modularui_version}"
        ordering="NONE"
        side="BOTH"

    [[dependencies.${mod_id}]]
        modId="kubejs"
        type="optional"
        versionRange="${kubejs_version}"
        ordering="AFTER"
        side="BOTH"
    [[dependencies.${mod_id}]]
        modId="emi"
        type="optional"
        versionRange="${emi_version}"
        ordering="AFTER"
        side="BOTH"
    [[dependencies.${mod_id}]]
        modId="jei"
        type="optional"
        versionRange="${jei_version}"
        ordering="AFTER"
        side="BOTH"
    [[dependencies.${mod_id}]]
        modId="jade"
        type="optional"
        versionRange="${jade_version}"
        ordering="AFTER"
        side="BOTH"
    [[dependencies.${mod_id}]]
        modId="curios"
        type="optional"
        versionRange="${curios_version}"
        ordering="AFTER"
        side="BOTH"
