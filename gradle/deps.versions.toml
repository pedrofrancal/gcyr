[versions]
# GregTech (built locally from GregTech-Modern branch 1.21, published to mavenLocal)
gtceu = "8.0.0"
gtceu-range = "[8.0,)"
registrate = "MC1.21-1.3.0+67"
# Configuration
configuration = "3.1.1-neoforge"
modularui = "3.3.1-SNAPSHOT"
modularui-range = "[3,)"

# Recipe viewers
emi = "1.1.24+1.21.1"
emi-range = "[1.1,)"
jei = "19.25.1.328"
jei-range = "[19.25,)"

# Curios
curios = "9.4.2+1.21.1"
curios-range = "[9.4,)"

# KJS
kubejs = "2101.7.2-build.336"
kubejs-range = "[2101.7,)"
rhino = "2101.2.7-build.81"

# WAILA-likes
jade = "15.10.0+neoforge" # modrinth maven
jade-range = "[15.10,)"

[libraries]
# GregTech
gtceu               = { module = "com.gregtechceu.gtceu:gtceu-1.21.1", version.ref = "gtceu" }
registrate          = { module = "com.tterrag.registrate:Registrate", version.ref = "registrate" }
# Configuration
configuration       = { module = "dev.toma.configuration:configuration-1.21.1", version.ref = "configuration" }
# ModularUI
modularui           = { module = "brachy.modularui:modularui-mc1.21.1", version.ref = "modularui" }

# Recipe viewers
emi                 = { module = "dev.emi:emi-neoforge", version.ref = "emi" }
jei-api-common      = { module = "mezz.jei:jei-1.21.1-common-api", version.ref = "jei" }
jei-api-neoforge    = { module = "mezz.jei:jei-1.21.1-neoforge-api", version.ref = "jei" }

# WAILA-likes
jade                = { module = "maven.modrinth:jade", version.ref = "jade" }

# KJS
kubejs              = { module = "dev.latvian.mods:kubejs-neoforge", version.ref = "kubejs" }
rhino               = { module = "dev.latvian.mods:rhino", version.ref = "rhino" }

# Curios
curios              = { module = "top.theillusivec4.curios:curios-neoforge", version.ref = "curios" }

[bundles]
jei-api = ["jei-api-common", "jei-api-neoforge"]
kjs     = ["kubejs", "rhino"]
